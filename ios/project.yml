# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` writes Erased.xcodeproj.
name: Erased
options:
  bundleIdPrefix: app.erased
  deploymentTarget:
    iOS: "27.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
targets:
  Erased:
    type: application
    platform: iOS
    sources:
      - Erased
      # The same Reply Coach file the Android app ships, generated from the extension's TypeScript.
      - path: ../android/app/src/main/assets/coach.json
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.erased.ios
        PRODUCT_NAME: Erased
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Erased
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ErasedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ErasedTests]
    dependencies:
      - target: Erased
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  ErasedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ErasedUITests]
    dependencies:
      - target: Erased
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Erased
schemes:
  Erased:
    build:
      targets: { Erased: all, ErasedTests: [test], ErasedUITests: [test] }
    test:
      targets: [ErasedTests, ErasedUITests]
