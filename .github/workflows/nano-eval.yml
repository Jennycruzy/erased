name: On-device accuracy check

# Runs the 66-reply accuracy check with Gemini Nano in real Google Chrome on a GitHub-hosted runner
# (public repo: 4 vCPU, 16 GB). Nothing leaves the runner: the model runs on the device and the replies
# are the public set in evals/replies.json. Results, screenshots and a screen recording are uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the model needs about 22 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt || true
      - name: Profile on the larger disk
        run: |
          if sudo mkdir -p /mnt/nano && sudo chown "$USER" /mnt/nano; then echo "PROFILE_DIR=/mnt/nano/profile" >> "$GITHUB_ENV"; else echo "PROFILE_DIR=$RUNNER_TEMP/profile" >> "$GITHUB_ENV"; fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Machine
        run: google-chrome --version; nproc; free -h
      - name: Accuracy check on the device
        run: bash scripts/ci/nano-eval.sh out
      - name: Summary
        if: always()
        run: |
          echo '## On-device accuracy check' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const d=require('./out/result.json');console.log(JSON.stringify({summary:d.eval&&d.eval.summary,download:d.download,availabilityAtStart:d.availabilityAtStart,fatal:d.fatal},null,2))" >> "$GITHUB_STEP_SUMMARY" || echo 'no result.json' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nano-eval
          path: out
          retention-days: 30
